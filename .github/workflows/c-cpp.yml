name: Arduino Build CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Linux is faster for Arduino builds

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: pip install -U platformio

    # --- UPDATED: Only build the ESP32 environment ---
    - name: Build Project (ESP32)
      run: pio run -d "code/Sem7HiTech_ClankerShooter" -e esp32doit-devkit-v1

    # --- ADDED: Run the unit tests natively ---
    - name: Run Unit Tests (Native)
      run: pio test -d "code/Sem7HiTech_ClankerShooter" -e native

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: Gun-Firmware
        # Changed .hex to .bin since ESP32 uses .bin files
        path: code/Sem7HiTech_ClankerShooter/.pio/build/esp32doit-devkit-v1/firmware.bin